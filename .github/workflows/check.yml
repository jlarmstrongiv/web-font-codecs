name: Check codecs
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-artifacts:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Pinned stable action versions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.10
          install: false
          cache: false
      - name: Provision pinned toolchain
        run: |
          mise trust
          mise install python node npm
          EMSDK_PYTHON="$(mise where python@3.14.7)/bin/python3" mise install emsdk
      - name: Validate release tag and compute project-site base
        id: release-config
        if: inputs.release-artifacts
        run: mise exec -- node scripts/verify-release.ts
      - name: Provision npm dependencies and managed browser engines
        run: |
          mise exec -- npm ci
          mise exec -- npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Build WASM and verify recorded source hashes
        run: mise exec -- npm run check:source
      - name: Complete local check
        run: mise exec -- npm run check
      - name: Build Pages distribution with repository base
        if: inputs.release-artifacts
        run: mise exec -- npm run web:build
        env:
          ASTRO_BASE_PATH: ${{ steps.release-config.outputs.pages-base }}
      - name: Pack tested release files without rebuilding
        if: inputs.release-artifacts
        run: mise exec -- node scripts/release-artifacts.ts
      - name: Upload release assets
        if: inputs.release-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: .cache/release-assets/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Archive tested Pages site
        if: inputs.release-artifacts
        run: tar --dereference --hard-dereference -C packages/web-font-converter-web/dist -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        if: inputs.release-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
